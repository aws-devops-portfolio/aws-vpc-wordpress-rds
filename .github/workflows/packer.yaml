name: Packer AMI Build 

permissions:
  id-token: write
  contents: read
  
on:
  push:
    branches:
      - main      
    paths:
      - 'packer/**'
      - '.github/workflows/packer.yaml'
  pull_request:
    branches:
      - develop

defaults:
  run:
    working-directory: packer

env:
  AWS_REGION: us-east-1

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:      
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubAction-Role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Sanity check EC2 permissions
        working-directory: .
        run: |
          aws sts get-caller-identity
          aws ec2 describe-regions --region us-east-1
          
      - name: Verify AWS CLI
        run: aws --version

      - name: Export AWS Region
        run: echo "AWS_REGION=us-east-1" >> $GITHUB_ENV

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.10.0"

      - name: Check if AMI exists
        id: check_ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
          --name "/ami/wordpress/latest" \
          --query "Parameter.Value" \
          --output text 2>/dev/null || echo "")

          echo "Retrieved AMI_ID:$AMI_ID" 

          if [ -z "$AMI_ID" ]; then
            echo "No AMI parameter found"
            echo "ami_exists=false" >> $GITHUB_OUTPUT
            exit 0  
          fi

          IMAGE_COUNT=$(aws ec2 describe-images \
            --region us-east-1 \
            --image-ids "$AMI_ID" \
            --query 'length(Images)' \
            --output text 2>/dev/null || echo "0")

          echo "Image count: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "AMI does not exist"
            echo "ami_exists=false" >> $GITHUB_OUTPUT
          else
            echo "AMI exists"
            echo "ami_exists=true" >> $GITHUB_OUTPUT
          fi                 

      - name: Build the AMI
        working-directory: packer
        if: steps.check_ami.outputs.ami_exists == 'false'
        run: |
          packer init .
          packer build .
